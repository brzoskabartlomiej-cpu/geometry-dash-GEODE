[package]
name = "geo-dash"
version = "0.1.0"
description = "Geo Dash - open source Geometry Dash style platformer"
edition = "2021"
rust-version = "1.77"

[lib]
name = "geo_dash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# this feature is used for production builds where `devUrl` is not available
custom-protocol = ["tauri/custom-protocol"]
